name: Weekly land scan

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch: {}    # also run on demand

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scanner
        run: python scripts/scan.py

      - name: Regulatory watch — re-check tracked items
        env:
          # Optional secrets — set these in repo Settings → Secrets & variables
          # → Actions to escalate past bot walls. Both are optional; chain
          # falls back gracefully if they're unset.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          HTTPS_PROXY_RESI: ${{ secrets.HTTPS_PROXY_RESI }}
        run: python scripts/watch_regulatory.py
        continue-on-error: true   # blocked sites shouldn't fail the build

      - name: Open issues for new high-rated listings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/notify.py

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "weekly scan: refresh data ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "no data changes"
          fi
